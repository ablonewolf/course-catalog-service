spring:
  application:
    name: course-catalog-service
  datasource:
    url: jdbc:postgresql://localhost:5432/course_catalog
    username: postgres
    password: postgres
    hikari:
      minimum-idle: 5
      maximum-pool-size: 50
      auto-commit: true
      connection-test-query: SELECT 1
  data:
    jdbc:
      repositories:
        enabled: false
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    generate-ddl: true

server:
  port: 7700
  servlet:
    context-path: /course-catalog
  error:
    whitelabel:
      enabled: false
